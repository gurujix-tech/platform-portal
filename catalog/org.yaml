# Ownership model for Gurujix (who is accountable).
# Docs: https://backstage.io/docs/features/software-catalog/descriptor-format#kind-group
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: platform-team
  title: Platform Team
  description: Owns the Gurujix Internal Developer Platform, portal, and golden paths.
spec:
  type: team
  children: []
  profile:
    displayName: Platform Team
    email: platform@gurujix.com
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: storefront-team
  title: Storefront Team
  description: Owns Gurujix Storefront application services in the storefront system.
spec:
  type: team
  children: []
  profile:
    displayName: Storefront Team
    email: storefront@gurujix.com
